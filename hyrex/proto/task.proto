syntax = "proto3";

package hyrex.performanceserver;

option go_package = "proto/";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// Top-level Priority enum
enum Priority {
  P_UNSPECIFIED = 0; // Will be treated as default (P5)
  P1 = 1;  // Lowest priority
  P2 = 2;
  P3 = 3;
  P4 = 4;
  P5 = 5;  // Default/normal priority
  P6 = 6;
  P7 = 7;
  P8 = 8;
  P9 = 9;
  P10 = 10; // Highest priority
}


enum TaskStatus {
    UNSPECIFIED = 0;
    SUCCESS = 1;
    FAILED = 2;
    RUNNING = 3;
    QUEUED = 4;
    UP_FOR_CANCEL = 5;
    CANCELED = 6;
    LOST = 7;
    STOPPED = 8;
    SKIPPED = 9;
    AWAIT_DEPS = 10;
    AWAIT_START_TIME = 11;
  }

message TaskRun {
  string id = 1;
  string durable_id = 2;
  string root_id = 3;
  string parent_id = 4;
  string task_name = 5;

  TaskStatus status = 6;

  bytes args = 7; // JSON serialized as bytes
  string queue = 8;
  Priority priority = 9;
  optional int32 timeout_seconds = 10;
  optional google.protobuf.Timestamp scheduled_start = 11;
  google.protobuf.Timestamp queued = 12;
  google.protobuf.Timestamp started = 13;
  google.protobuf.Timestamp finished = 14;
  
  optional string workflow_run_id = 15;
  repeated string workflow_dependencies = 16;
  int32 attempt_number = 17;
  int32 max_retries = 18;

  string result = 19;
  string log_link = 20;

  string executor_id = 21;
}

message TaskDef {
  string task_name = 1;
  optional google.protobuf.Struct arg_schema = 2;
  optional string cron = 3;
  optional string source_code = 4;
  string queue = 5;
  Priority priority = 6;
  int32 max_retries = 7;
  optional int32 timeout_seconds = 8;
  optional google.protobuf.Timestamp last_updated = 9;
}
